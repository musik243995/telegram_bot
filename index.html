<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровой Центр</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f1015; --card: #181b24; --accent: #3b82f6; --text: #ffffff; --muted: #94a3b8; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px 16px; border-radius: 12px; margin-bottom: 15px; }
        .balance { font-weight: bold; color: #22c55e; font-size: 1.1rem; }
        
        /* КРАСИВЫЕ ГРАФИЧЕСКИЕ КНОПКИ-БАННЕРЫ СВЕРХУ */
        .image-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .image-tab-card { background: var(--card); border: 2px solid #262b36; border-radius: 14px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .image-tab-card:active { transform: scale(0.96); }
        .image-tab-card.active { border-color: var(--accent); background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), var(--card)); }
        .image-tab-card img { width: 48px; height: 48px; object-fit: contain; margin-bottom: 6px; }
        .image-tab-card span { font-weight: bold; font-size: 0.95rem; color: var(--text); }

        /* Кнопка инвентаря отдельно снизу или сбоку компактно */
        .inv-tab-btn { width: 100%; background: var(--card); border: 2px solid #262b36; border-radius: 10px; padding: 10px; color: var(--text); font-weight: bold; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .inv-tab-btn.active { border-color: var(--accent); background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), var(--card)); }

        .view-section { display: none; }
        .view-section.active { display: block; }
        
        /* Кейсы */
        .cases-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .case-card { background: var(--card); border-radius: 12px; padding: 15px; border: 1px solid #262b36; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .case-info h3 { margin: 0 0 5px 0; font-size: 1.1rem; }
        .case-info p { margin: 0; color: #f59e0b; font-weight: bold; font-size: 0.9rem; }
        .enter-arrow { font-size: 1.2rem; color: var(--muted); }

        .case-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .back-btn { background: var(--card); border: 1px solid #262b36; color: var(--text); padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        
        .drop-list { font-size: 0.85rem; color: var(--muted); margin: 15px 0; line-height: 1.5; background: var(--card); padding: 12px; border-radius: 10px; border: 1px solid #262b36; }
        .open-btn { width: 100%; padding: 12px; background: #22c55e; border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }

        .roulette-container { position: relative; width: 100%; height: 120px; background: #12141c; border-radius: 12px; overflow: hidden; margin: 15px 0; display: flex; align-items: center; border: 2px solid #262b36; }
        .roulette-pointer { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; background: #ef4444; z-index: 10; transform: translateX(-50%); }
        .roulette-track { display: flex; gap: 10px; position: absolute; left: 0; transition: transform 4s cubic-bezier(0.15, 0.85, 0.35, 1); }
        .roulette-item { min-width: 90px; height: 90px; background: #1e222d; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.8rem; border: 1px solid #333947; }
        .roulette-item span { font-size: 0.7rem; margin-top: 5px; color: var(--muted); text-align: center; padding: 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 80px; }

        /* Игровой автомат (Казино) */
        .slot-machine-wrapper { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 20px 0; }
        .slot-machine { background: linear-gradient(135deg, #1e222d, #12141c); border: 4px solid #f59e0b; border-radius: 20px; padding: 25px; text-align: center; width: 280px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .slots-display { display: flex; justify-content: center; gap: 10px; background: #0b0c10; padding: 15px; border-radius: 12px; border: 2px solid #333947; margin-bottom: 20px; }
        .slot-reel { font-size: 2.5rem; width: 55px; height: 70px; background: #181b24; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #262b36; }
        
        .slot-lever { display: flex; flex-direction: column; align-items: center; cursor: pointer; user-select: none; }
        .lever-stick { width: 10px; height: 90px; background: #94a3b8; border-radius: 5px; position: relative; transition: transform 0.2s; }
        .lever-knob { width: 30px; height: 30px; background: #ef4444; border-radius: 50%; position: absolute; top: -15px; left: -10px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .slot-lever.pulled .lever-stick { transform: rotateX(45deg); }

        .slot-input { width: 100%; padding: 12px; background: #0b0c10; border: 1px solid #333947; color: white; border-radius: 8px; font-size: 1rem; text-align: center; margin-bottom: 10px; box-sizing: border-box; }
        .spin-btn { width: 100%; padding: 12px; background: #f59e0b; border: none; color: #000; font-weight: bold; border-radius: 8px; font-size: 1.1rem; cursor: pointer; }
        .spin-btn:active { transform: scale(0.98); }

        /* Инвентарь */
        .inventory-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .inv-item { background: var(--card); border-radius: 10px; padding: 12px; text-align: center; border: 1px solid #262b36; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 14px; width: 85%; max-width: 320px; text-align: center; border: 1px solid #333947; }
        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
        .modal-btns button { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-yes { background: #ef4444; color: white; }
        .btn-no { background: #333947; color: white; }
    </style>
</head>
<body>

    <header>
        <div>🎲 Игровой Центр</div>
        <div class="balance" id="user-balance">0 ¢</div>
    </header>

    <!-- ГРАФИЧЕСКИЕ КНОПКИ СВЕРХУ (КАРТИНКИ + ТЕКСТ) -->
    <div class="image-tabs">
        <div class="image-tab-card active" id="tab-cases-btn" onclick="switchTopTab('cases')">
            <img src="https://cdn-icons-png.flaticon.com/512/4248/4248443.png" alt="Кейсы">
            <span>🎁 Кейсы</span>
        </div>
        <div class="image-tab-card" id="tab-casino-btn" onclick="switchTopTab('casino')">
            <img src="https://cdn-icons-png.flaticon.com/512/2454/2454282.png" alt="Казино">
            <span>🎰 Казино</span>
        </div>
    </div>

    <button class="inv-tab-btn" id="tab-inv-btn" onclick="switchTopTab('inventory')">
        🎒 Инвентарь
    </button>

    <!-- РАЗДЕЛ КЕЙСОВ -->
    <div id="section-cases" class="view-section active">
        <div id="view-cases-list" class="view-section active">
            <div class="cases-grid" id="cases-grid"></div>
        </div>

        <div id="view-case-room" class="view-section">
            <div class="case-header">
                <button class="back-btn" onclick="goBackToList()">❮</button>
                <h2 id="room-case-title" style="margin: 0; font-size: 1.2rem;">Кейс</h2>
            </div>
            <div class="roulette-container">
                <div class="roulette-pointer"></div>
                <div class="roulette-track" id="roulette-track"></div>
            </div>
            <div id="win-notification" style="text-align: center; font-weight: bold; color: #f59e0b; margin-bottom: 10px; min-height: 24px;"></div>
            <button class="open-btn" onclick="openCurrentCase()">Открыть кейс</button>
            <div class="drop-list" id="room-drop-list"></div>
        </div>
    </div>

    <!-- РАЗДЕЛ КАЗИНО -->
    <div id="section-casino" class="view-section">
        <div style="text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 5px;">Комбинации: 🍋🍋🍋, 🍇🍇🍇, 🎁🎁🎁 (x4) | 7️⃣7️⃣7️⃣ (x6)</div>
        
        <div class="slot-machine-wrapper">
            <div class="slot-machine">
                <div class="slots-display">
                    <div class="slot-reel" id="reel-1">7️⃣</div>
                    <div class="slot-reel" id="reel-2">🍋</div>
                    <div class="slot-reel" id="reel-3">🍇</div>
                </div>
                <input type="number" id="slot-bet-input" class="slot-input" placeholder="Сумма ставки" value="100000">
                <button class="spin-btn" onclick="spinSlotMachine()">КРУТИТЬ</button>
            </div>

            <div class="slot-lever" id="slot-lever" onclick="spinSlotMachine()">
                <div class="lever-stick"><div class="lever-knob"></div></div>
            </div>
        </div>
        <div id="slot-notification" style="text-align: center; font-weight: bold; color: #f59e0b; margin-top: 10px; min-height: 24px;"></div>
    </div>

    <!-- РАЗДЕЛ ИНВЕНТАРЯ -->
    <div id="section-inventory" class="view-section">
        <div class="inventory-grid" id="inventory-grid"></div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПРОДАЖИ -->
    <div class="modal" id="sell-modal">
        <div class="modal-content">
            <h3>Продажа предмета</h3>
            <p id="modal-item-name" style="margin: 10px 0; color: var(--muted);"></p>
            <p style="font-weight: bold; color: #22c55e;" id="modal-item-price"></p>
            <p>Вы точно хотите продать этот предмет?</p>
            <div class="modal-btns">
                <button class="btn-yes" onclick="confirmSell()">Да</button>
                <button class="btn-no" onclick="closeModal()">Нет</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || 1222239198;

        let userBalance = 0;
        let inventory = [];
        let selectedItemForSell = null;
        let activeCaseId = null;

        const casesData = [
            {
                id: 1, name: "🏠 Квартиры", price: 5000000,
                items: [
                    { name: "Ключи от однушки", price: 500000, chance: 45, emoji: "🔑" },
                    { name: "Ключи от двушки", price: 2500000, chance: 35, emoji: "🚪" },
                    { name: "Ключи от трешки", price: 7500000, chance: 15, emoji: "🏢" },
                    { name: "Ключи от 4комнатной", price: 10000000, chance: 5, emoji: "🏰" }
                ],
                dropListText: "<b>Что может выпасть:</b><br>🔑 Ключи от однушки (500.000¢ — 45%)<br>🚪 Ключи от двушки (2.500.000¢ — 35%)<br>🏢 Ключи от трешки (7.500.000¢ — 15%)<br>🏰 Ключи от 4комнатной (10.000.000¢ — 5%)"
            },
            {
                id: 2, name: "🏡 Дома", price: 10000000,
                items: [
                    { name: "Ключи от маленького домика", price: 3500000, chance: 45, emoji: "🛖" },
                    { name: "Средний домик", price: 6500000, chance: 35, emoji: "🏠" },
                    { name: "Большой дом", price: 12500000, chance: 15, emoji: "🏡" },
                    { name: "Пин Хаус", price: 20000000, chance: 5, emoji: "🌇" }
                ],
                dropListText: "<b>Что может выпасть:</b><br>🛖 Ключи от маленького домика (3.500.000¢ — 45%)<br>🏠 Средний домик (6.500.000¢ — 35%)<br>🏡 Большой дом (12.500.000¢ — 15%)<br>🌇 Пин Хаус (20.000.000¢ — 5%)"
            },
            {
                id: 3, name: "🚗 Машины", price: 15000000,
                items: [
                    { name: "Жигуль", price: 5000000, chance: 45, emoji: "🚙" },
                    { name: "Камри", price: 10000000, chance: 35, emoji: "🚗" },
                    { name: "БМВ", price: 20000000, chance: 15, emoji: "🏎️" },
                    { name: "БУГАТИ", price: 25000000, chance: 5, emoji: "🚀" }
                ],
                dropListText: "<b>Что может выпасть:</b><br>🚙 Жигуль (5.000.000¢ — 45%)<br>🚗 Камри (10.000.000¢ — 35%)<br>🏎️ БМВ (20.000.000¢ — 15%)<br>🚀 БУГАТИ (25.000.000¢ — 5%)"
            },
            {
                id: 4, name: "🏢 Компании", price: 25000000,
                items: [
                    { name: "Кп по кв", price: 15000000, chance: 45, emoji: "📊" },
                    { name: "Кп по мш", price: 20000000, chance: 35, emoji: "📈" },
                    { name: "Кп по дм", price: 30000000, chance: 15, emoji: "🏢" },
                    { name: "Кп по флт", price: 40000000, chance: 5, emoji: "💎" }
                ],
                dropListText: "<b>Что может выпасть:</b><br>📊 Кп по кв (15.000.000¢ — 45%)<br>📈 Кп по мш (20.000.000¢ — 35%)<br>🏢 Кп по дм (30.000.000¢ — 15%)<br>💎 Кп по флт (40.000.000¢ — 5%)"
            }
        ];

        function initCasesList() {
            const grid = document.getElementById('cases-grid');
            grid.innerHTML = casesData.map(c => `
                <div class="case-card" onclick="openCaseRoom(${c.id})">
                    <div class="case-info">
                        <h3>${c.name}</h3>
                        <p>Цена: ${c.price.toLocaleString()} ¢</p>
                    </div>
                    <div class="enter-arrow">➔</div>
                </div>
            `).join('');
        }

        function switchTopTab(tab) {
            document.getElementById('tab-cases-btn').classList.remove('active');
            document.getElementById('tab-casino-btn').classList.remove('active');
            document.getElementById('tab-inv-btn').classList.remove('active');

            document.getElementById('section-cases').classList.remove('active');
            document.getElementById('section-casino').classList.remove('active');
            document.getElementById('section-inventory').classList.remove('active');

            if(tab === 'cases') {
                document.getElementById('tab-cases-btn').classList.add('active');
                document.getElementById('section-cases').classList.add('active');
                goBackToList();
            } else if(tab === 'casino') {
                document.getElementById('tab-casino-btn').classList.add('active');
                document.getElementById('section-casino').classList.add('active');
            } else {
                document.getElementById('tab-inv-btn').classList.add('active');
                document.getElementById('section-inventory').classList.add('active');
                loadInventory();
            }
        }

        function openCaseRoom(caseId) {
            activeCaseId = caseId;
            const c = casesData.find(x => x.id === caseId);
            document.getElementById('room-case-title').innerText = `${c.name} (${c.price.toLocaleString()} ¢)`;
            document.getElementById('room-drop-list').innerHTML = c.dropListText;
            document.getElementById('win-notification').innerText = '';

            document.getElementById('view-cases-list').classList.remove('active');
            document.getElementById('view-case-room').classList.add('active');
            createRouletteDummy(c);
        }

        function goBackToList() {
            document.getElementById('view-case-room').classList.remove('active');
            document.getElementById('view-cases-list').classList.add('active');
            activeCaseId = null;
        }

        function createRouletteDummy(caseItem) {
            const track = document.getElementById('roulette-track');
            let html = '';
            for(let i=0; i<30; i++) {
                let item = caseItem.items[Math.floor(Math.random() * caseItem.items.length)];
                html += `<div class="roulette-item">${item.emoji}<span>${item.name}</span></div>`;
            }
            track.innerHTML = html;
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
        }

        async function fetchData() {
            try {
                const res = await fetch(`/api/get_data?user_id=${userId}`);
                const data = await res.json();
                userBalance = data.balance;
                document.getElementById('user-balance').innerText = userBalance.toLocaleString() + ' ¢';
            } catch(e) { console.error(e); }
        }

        async function openCurrentCase() {
            if(!activeCaseId) return;
            const caseItem = casesData.find(c => c.id === activeCaseId);
            if(userBalance < caseItem.price) {
                alert('❌ Недостаточно средств!');
                return;
            }

            const res = await fetch('/api/open_case', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: userId, case_id: activeCaseId})
            });
            const data = await res.json();
            if(data.error) { alert(data.error); return; }

            userBalance = data.new_balance;
            document.getElementById('user-balance').innerText = userBalance.toLocaleString() + ' ¢';

            const track = document.getElementById('roulette-track');
            const wonItem = caseItem.items.find(i => i.name === data.item_name) || caseItem.items[0];
            
            let itemsHtml = '';
            let winningIndex = 25;
            for(let i=0; i<35; i++) {
                let item = (i === winningIndex) ? wonItem : caseItem.items[Math.floor(Math.random() * caseItem.items.length)];
                itemsHtml += `<div class="roulette-item">${item.emoji}<span>${item.name}</span></div>`;
            }
            track.innerHTML = itemsHtml;
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';

            document.getElementById('win-notification').innerText = '🌀 Крутим рулетку...';

            setTimeout(() => {
                track.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.35, 1)';
                const offset = (winningIndex * 100) - 120 + Math.random()*40;
                track.style.transform = `translateX(-${offset}px)`;
            }, 50);

            setTimeout(() => {
                document.getElementById('win-notification').innerText = `🎉 Вы выиграли: ${wonItem.emoji} ${wonItem.name} (${wonItem.price.toLocaleString()} ¢)!`;
            }, 4100);
        }

        async function spinSlotMachine() {
            const betInput = document.getElementById('slot-bet-input');
            const bet = parseInt(betInput.value);
            if(!bet || bet <= 0) { alert('❌ Введите корректную ставку!'); return; }
            if(userBalance < bet) { alert('❌ Недостаточно средств!'); return; }

            const lever = document.getElementById('slot-lever');
            lever.classList.add('pulled');
            setTimeout(() => lever.classList.remove('pulled'), 300);

            document.getElementById('slot-notification').innerText = '🎰 Крутим барабаны...';

            const symbolsList = ["7️⃣", "🍋", "🍇", "🎁"];
            const interval = setInterval(() => {
                document.getElementById('reel-1').innerText = symbolsList[Math.floor(Math.random()*symbolsList.length)];
                document.getElementById('reel-2').innerText = symbolsList[Math.floor(Math.random()*symbolsList.length)];
                document.getElementById('reel-3').innerText = symbolsList[Math.floor(Math.random()*symbolsList.length)];
            }, 80);

            try {
                const res = await fetch('/api/casino_spin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId, bet: bet})
                });
                const data = await res.json();

                setTimeout(() => {
                    clearInterval(interval);
                    
                    if(data.error) { 
                        alert(data.error); 
                        document.getElementById('slot-notification').innerText = ''; 
                        return; 
                    }

                    userBalance = data.new_balance;
                    document.getElementById('user-balance').innerText = userBalance.toLocaleString() + ' ¢';

                    document.getElementById('reel-1').innerText = data.symbols[0];
                    document.getElementById('reel-2').innerText = data.symbols[1];
                    document.getElementById('reel-3').innerText = data.symbols[2];

                    if(data.won) {
                        document.getElementById('slot-notification').innerText = `🎉 Победа! Выигрыш: +${data.payout.toLocaleString()} ¢`;
                    } else {
                        document.getElementById('slot-notification').innerText = `😢 Проигрыш! Потеряно: -${bet.toLocaleString()} ¢`;
                    }
                }, 1500);

            } catch (err) {
                clearInterval(interval);
                document.getElementById('slot-notification').innerText = '❌ Ошибка соединения с сервером';
                console.error(err);
            }
        }

        async function loadInventory() {
            const res = await fetch(`/api/get_inventory?user_id=${userId}`);
            inventory = await res.json();
            const grid = document.getElementById('inventory-grid');
            if(inventory.length === 0) {
                grid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: var(--muted); padding: 20px;">Инвентарь пуст</div>';
                return;
            }
            grid.innerHTML = inventory.map((item, idx) => `
                <div class="inv-item" onclick="openSellModal(${idx})">
                    <div style="font-size: 2rem;">🎁</div>
                    <div style="font-weight: bold; font-size: 0.9rem; margin: 5px 0;">${item.name}</div>
                    <div style="color: #22c55e; font-size: 0.8rem;">${item.price.toLocaleString()} ¢</div>
                </div>
            `).join('');
        }

        function openSellModal(index) {
            selectedItemForSell = inventory[index];
            document.getElementById('modal-item-name').innerText = selectedItemForSell.name;
            document.getElementById('modal-item-price').innerText = `Цена продажи: ${selectedItemForSell.price.toLocaleString()} ¢`;
            document.getElementById('sell-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('sell-modal').style.display = 'none';
            selectedItemForSell = null;
        }

        async function confirmSell() {
            if(!selectedItemForSell) return;
            const res = await fetch('/api/sell_item', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: userId, item_id: selectedItemForSell.id})
            });
            const data = await res.json();
            if(data.success) {
                userBalance = data.new_balance;
                document.getElementById('user-balance').innerText = userBalance.toLocaleString() + ' ¢';
                closeModal();
                loadInventory();
            } else {
                alert('Ошибка при продаже');
            }
        }

        fetchData();
        initCasesList();
    </script>
